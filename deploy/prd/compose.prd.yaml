services:
  db:
    image: postgres:16-alpine
    container_name: croniu-prd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - croniu-prd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy: {resources: {limits: {memory: 1G}}}

  api:
    image: ${CRONIU_API_IMAGE:?Set immutable API image}
    container_name: croniu-prd-api
    restart: unless-stopped
    env_file: [.env.prd]
    environment:
      CRONIU_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1"
      EMAIL_VERIFICATION_REQUIRED: "true"
    # Loopback only — Cloudflare Tunnel on the host reaches services without public bind.
    ports: ["127.0.0.1:${API_HOST_PORT}:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      croniu-prd-network:
        aliases: [api]
    logging: *logging
    deploy: {resources: {limits: {memory: 1G}}}

  web:
    image: ${CRONIU_WEB_IMAGE:?Set immutable web image}
    container_name: croniu-prd-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:${WEB_HOST_PORT}:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 512M}}}

  admin:
    image: ${CRONIU_ADMIN_IMAGE:?Set immutable admin image}
    container_name: croniu-prd-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:${ADMIN_HOST_PORT}:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 512M}}}

  # Optional Cloudflare Tunnel connector (profile: edge). Off by default.
  # First loopback deploy / deploy.sh must NOT pass --profile edge.
  # Prefer deploy/prd/edge_up.sh (fails closed if CLOUDFLARE_TUNNEL_TOKEN is empty).
  # Note: Compose interpolates this file even when the profile is inactive, so
  # CLOUDFLARE_TUNNEL_TOKEN uses ${...:-} (empty allowed) rather than :? here.
  # Explicit activation:
  #   ./deploy/prd/edge_up.sh
  #   # or: docker compose ... --profile edge up -d cloudflared
  # Stop connector without touching app/db:
  #   docker compose ... --profile edge stop cloudflared
  # Remote origins (configured in Cloudflare, not here):
  #   app.croniu.com.br   -> http://web:3000
  #   api.croniu.com.br   -> http://api:8000
  #   admin.croniu.com.br -> http://admin:3000  (Cloudflare Access required before publish)
  # Image pin: Docker Hub tag 2025.7.0 multi-arch manifest (never :latest).
  # Auth: TUNNEL_TOKEN from env (official cloudflared contract); no credentials volume.
  # Release upgrades recreate api/web/admin only; edge is independent and opt-in.
  cloudflared:
    profiles: ["edge"]
    image: cloudflare/cloudflared@sha256:803b17adb5326a38ce397b9c9f374289ad290ee5526d204b5879a1423b6f5c3e
    container_name: croniu-prd-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 256M}}}

volumes:
  croniu-prd-postgres-data: {name: croniu-prd-postgres-data}

networks:
  croniu-prd-network: {name: croniu-prd-network}
