services:
  db:
    image: postgres:16-alpine
    container_name: croniu-prd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - croniu-prd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy: {resources: {limits: {memory: 1G}}}

  api:
    image: ${CRONIU_API_IMAGE:?Set immutable API image}
    container_name: croniu-prd-api
    restart: unless-stopped
    env_file: [.env.prd]
    environment:
      CRONIU_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: ["${API_HOST_PORT}:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 1G}}}

  web:
    image: ${CRONIU_WEB_IMAGE:?Set immutable web image}
    container_name: croniu-prd-web
    restart: unless-stopped
    ports: ["${WEB_HOST_PORT}:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 512M}}}

  admin:
    image: ${CRONIU_ADMIN_IMAGE:?Set immutable admin image}
    container_name: croniu-prd-admin
    restart: unless-stopped
    ports: ["${ADMIN_HOST_PORT}:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [croniu-prd-network]
    logging: *logging
    deploy: {resources: {limits: {memory: 512M}}}

volumes:
  croniu-prd-postgres-data: {name: croniu-prd-postgres-data}

networks:
  croniu-prd-network: {name: croniu-prd-network}
