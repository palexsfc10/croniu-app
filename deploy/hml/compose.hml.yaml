services:
  croniu-hml-db:
    image: postgres:16-alpine
    container_name: croniu-hml-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - croniu-hml-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croniu-hml-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  croniu-hml-api:
    image: ${CRONIU_API_IMAGE:-croniu-hml-api:local}
    container_name: croniu-hml-api
    restart: unless-stopped
    env_file:
      - .env.hml
    environment:
      CRONIU_ENV: hml
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@croniu-hml-db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
    ports:
      - "${API_HOST_PORT}:8000"
    depends_on:
      croniu-hml-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - croniu-hml-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  croniu-hml-web:
    image: ${CRONIU_WEB_IMAGE:-croniu-hml-web:local}
    container_name: croniu-hml-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_HOST_PORT}:3000"
    depends_on:
      croniu-hml-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - croniu-hml-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

  croniu-hml-admin:
    image: ${CRONIU_ADMIN_IMAGE:-croniu-hml-admin:local}
    container_name: croniu-hml-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${ADMIN_HOST_PORT}:3000"
    depends_on:
      croniu-hml-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - croniu-hml-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  croniu-hml-postgres-data:
    name: croniu-hml-postgres-data

networks:
  croniu-hml-network:
    name: croniu-hml-network
