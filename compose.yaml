services:
  db:
    image: postgres:16-alpine
    container_name: croniu-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-croniu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-croniu_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-croniu}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - croniu-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-croniu} -d ${POSTGRES_DB:-croniu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - croniu-dev-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: croniu-dev-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-croniu}:${POSTGRES_PASSWORD:-croniu_dev_password_change_me}@db:5432/${POSTGRES_DB:-croniu}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croniu-dev-network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: croniu-dev-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - croniu-dev-network

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3002}
    container_name: croniu-dev-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3002}
    ports:
      - "${ADMIN_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - croniu-dev-network

volumes:
  croniu-dev-postgres-data:

networks:
  croniu-dev-network:
    name: croniu-dev-network
