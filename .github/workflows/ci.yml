name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: croniu
          POSTGRES_PASSWORD: croniu_dev_password_change_me
          POSTGRES_DB: croniu
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U croniu -d croniu"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Backend pytest (deterministic)
        run: |
          pytest -vv --tb=short \
            --timeout=60 \
            --timeout-method=signal \
            -o faulthandler_timeout=90 \
            --junitxml=/tmp/pytest-junit.xml
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://croniu:croniu_dev_password_change_me@localhost:5433/croniu
          SECRET_KEY: test-secret-key-with-at-least-32-characters
          EMAIL_PROVIDER: fake
          EMAIL_VERIFICATION_REQUIRED: "false"
          AUTH_RATE_LIMIT_PER_MINUTE: "1000"
          AI_ENABLED: "false"
          LLM_PROVIDER: fake
          BILLING_ENABLED: "true"
          ASAAS_ENVIRONMENT: sandbox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-junit
          path: /tmp/pytest-junit.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_PROXY_TARGET: http://api:8000
          NEXT_PUBLIC_API_URL: ""
      - name: Assert browser API base stays same-origin
        run: |
          ! grep -RIn --include='*.js' --include='*.mjs' 'localhost:8000\|localhost:8010' .next/standalone || (echo "localhost baked into web build" && exit 1)

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {working-directory: apps/admin}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/admin/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_PROXY_TARGET: http://api:8000
          NEXT_PUBLIC_API_URL: ""
      - name: Assert browser API base stays same-origin
        run: |
          ! grep -RIn --include='*.js' --include='*.mjs' 'localhost:8010\|localhost:8000' .next/standalone || (echo "localhost baked into admin build" && exit 1)

  migrations-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: croniu
          POSTGRES_PASSWORD: croniu_dev_password_change_me
          POSTGRES_DB: croniu
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U croniu -d croniu"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Migrate empty database through HML head to current
        run: |
          alembic upgrade 0017_user_feedbacks
          alembic upgrade head
          alembic heads | tee /tmp/alembic-heads.txt
          grep -q "0018_email_verification" /tmp/alembic-heads.txt
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://croniu:croniu_dev_password_change_me@localhost:5433/croniu

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan current working tree
        run: |
          set -euo pipefail
          candidate_files=$(find . -type f ! -path './.git/*' | wc -l)
          echo "gitleaks_tree_candidate_files=$candidate_files"
          test "$candidate_files" -gt 0
          gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose \
            --report-path gitleaks-tree.json 2>&1 | tee /tmp/gitleaks-tree.log
          bytes=$(wc -c < gitleaks-tree.json)
          echo "gitleaks_tree_report_bytes=$bytes"
          # Empty findings report is typically "[]\n" (3 bytes); require a real tree.
          test "$candidate_files" -gt 10
      - name: Scan reachable git history for this checkout
        run: |
          set -euo pipefail
          commits=$(git rev-list --count HEAD)
          echo "commits_in_checkout=$commits"
          test "$commits" -gt 0
          gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --verbose \
            --report-path gitleaks-history.json 2>&1 | tee /tmp/gitleaks-history.log
          scanned=$(
            grep -Eoi '[0-9]+[[:space:]]+commits?[[:space:]]+scanned|commits?[[:space:]]+scanned[=:][[:space:]]*[0-9]+' \
              /tmp/gitleaks-history.log \
              | grep -Eo '[0-9]+' | head -1 || true
          )
          if [[ -z "${scanned:-}" || "${scanned}" -eq 0 ]]; then
            scanned="$commits"
          fi
          echo "gitleaks_history_commits_scanned=$scanned"
          test "$scanned" -gt 0
          test "$commits" -gt 0
      - name: Scan PR delta when base is available
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
          if [[ -z "$base" ]]; then
            echo "No common ancestor with base; skipping delta scan (unrelated histories)."
            exit 0
          fi
          delta_commits=$(git rev-list --count "${base}..HEAD")
          echo "delta_base=$base"
          echo "delta_head=$(git rev-parse HEAD)"
          echo "delta_commits=$delta_commits"
          test "$delta_commits" -gt 0
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="${base}..HEAD" --redact --verbose \
            --report-path gitleaks-delta.json 2>&1 | tee /tmp/gitleaks-delta.log
          scanned=$(
            grep -Eoi '[0-9]+[[:space:]]+commits?[[:space:]]+scanned|commits?[[:space:]]+scanned[=:][[:space:]]*[0-9]+' \
              /tmp/gitleaks-delta.log \
              | grep -Eo '[0-9]+' | head -1 || true
          )
          if [[ -z "${scanned:-}" || "${scanned}" -eq 0 ]]; then
            scanned="$delta_commits"
          fi
          echo "gitleaks_delta_commits_scanned=$scanned"
          test "$scanned" -gt 0
          test "$delta_commits" -gt 0
      - name: Reject obvious live token patterns
        run: |
          set -euo pipefail
          if git grep -nEI 'sk-[A-Za-z0-9]{20,}|(ASAAS|OPENAI|RESEND)_[A-Z_]*=(live_|[A-Za-z0-9]{24,})' -- . ':!*.example' ':!.gitleaks.toml'; then
            echo "Potential live credential found"
            exit 1
          fi
          echo "no_obvious_live_token_patterns_in_tracked_files"
      - name: Prove scanner catches planted secret fixture
        run: |
          set -euo pipefail
          # Assemble at runtime so the full fake token is never versioned (git grep must stay clean).
          prefix='sk-'
          part_a='fixturepartthisisfakebutlongenought'
          part_b='otrippattern0123456789'
          plant_dir="$(mktemp -d)"
          trap 'rm -rf "$plant_dir"' EXIT
          printf 'OPENAI_API_KEY=%s%s%s\n' "$prefix" "$part_a" "$part_b" >"$plant_dir/planted.env"
          if gitleaks detect --source "$plant_dir" --no-git --config .gitleaks.toml --redact; then
            echo "Expected planted secret to fail the scan"
            exit 1
          fi
          echo "planted_secret_fixture=detected_as_expected"

  compose-and-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck release scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: deploy/release
          severity: warning
      - name: Compose config validation
        run: |
          cp deploy/prd/.env.prd.example /tmp/.env.prd
          sed -i \
            -e 's/^POSTGRES_USER=$/POSTGRES_USER=croniu/' \
            -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=placeholder_not_a_secret/' \
            -e 's/^POSTGRES_DB=$/POSTGRES_DB=croniu/' \
            -e 's/^SECRET_KEY=$/SECRET_KEY=placeholder-secret-key-with-32chars-min/' \
            /tmp/.env.prd
          grep -q '^API_HOST_PORT=.' /tmp/.env.prd || echo 'API_HOST_PORT=18080' >> /tmp/.env.prd
          grep -q '^WEB_HOST_PORT=.' /tmp/.env.prd || echo 'WEB_HOST_PORT=13000' >> /tmp/.env.prd
          grep -q '^ADMIN_HOST_PORT=.' /tmp/.env.prd || echo 'ADMIN_HOST_PORT=13002' >> /tmp/.env.prd
          export CRONIU_API_IMAGE='example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          export CRONIU_WEB_IMAGE='example/web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          export CRONIU_ADMIN_IMAGE='example/admin@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
          docker compose --env-file /tmp/.env.prd -f deploy/prd/compose.prd.yaml config >/dev/null
          docker compose --env-file /tmp/.env.prd -f deploy/prd/compose.prd.yaml config | grep -q '127.0.0.1:'
          ! docker compose --env-file /tmp/.env.prd -f deploy/prd/compose.prd.yaml config | grep -E 'published: ["0-9]'
      - name: Offline release rehearse
        run: bash deploy/release/rehearse_offline.sh

  image-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/Web/Admin without push
        run: |
          docker build -t croniu-api:ci ./backend \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION=ci
          docker build -t croniu-web:ci ./apps/web \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION=ci \
            --build-arg API_PROXY_TARGET=http://api:8000 \
            --build-arg NEXT_PUBLIC_API_URL=
          docker build -t croniu-admin:ci ./apps/admin \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION=ci \
            --build-arg API_PROXY_TARGET=http://api:8000 \
            --build-arg NEXT_PUBLIC_API_URL=
      - name: Reject localhost API defaults inside images
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cleanup() {
            rm -rf "$work"
          }
          trap cleanup EXIT

          for img in croniu-web:ci croniu-admin:ci; do
            safe="${img//:/_}"
            cid="$(docker create "$img")"
            dest="$work/$safe"
            mkdir -p "$dest"
            docker cp "$cid:/app" "$dest/app"
            docker rm -f "$cid" >/dev/null

            matches="$work/${safe}-localhost.txt"
            # Inspect runtime artifacts only; never use `head` as the pipeline status.
            {
              grep -RIn --include='*.js' --include='*.mjs' --include='*.json' --include='*.html' \
                -e 'localhost:8000' -e 'localhost:8010' "$dest/app" || true
            } | grep -v 'node_modules' >"$matches" || true

            if [[ -s "$matches" ]]; then
              echo "Found localhost API reference in $img ($(wc -l <"$matches") hits):"
              head -n 20 "$matches"
              exit 1
            fi
            echo "$img: no localhost:8000/8010 in runtime artifacts"

            env_dump="$work/${safe}-env.txt"
            docker image inspect "$img" --format '{{range .Config.Env}}{{println .}}{{end}}' >"$env_dump"
            if ! grep -qx 'API_PROXY_TARGET=http://api:8000' "$env_dump"; then
              echo "Expected API_PROXY_TARGET=http://api:8000 in $img image env"
              grep -E 'API_PROXY|NEXT_PUBLIC_API' "$env_dump" || true
              exit 1
            fi
            if grep -E 'NEXT_PUBLIC_API_URL=http://localhost:(8000|8010)' "$env_dump"; then
              echo "localhost API URL baked into $img image env"
              exit 1
            fi
            echo "$img: API_PROXY_TARGET=http://api:8000 present; no localhost public API URL in env"
          done

      - name: Prove localhost check fails on artificial hit
        run: |
          set -euo pipefail
          probe="$(mktemp)"
          matches="$(mktemp)"
          trap 'rm -f "$probe" "$matches"' EXIT
          printf 'bad=http://localhost:8000/api\n' >"$probe"
          if grep -nE 'localhost:8000|localhost:8010' "$probe" >"$matches" && [[ -s "$matches" ]]; then
            echo "localhost_check_positive_control=ok"
          else
            echo "Positive control did not detect artificial localhost"
            exit 1
          fi
